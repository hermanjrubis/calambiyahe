<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Your Business – Calzada</title>
    <meta name="description" content="Register your local business or eatery to get commuters straight to your door with jeepney routes and fares in Calamba.">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="../css/skeleton.css?v=3.0.0">
    <link href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" rel="stylesheet">

    <style>
        :root {
            --primary: #378ADD;
            --primary-dark: #185FA5;
            --primary-light: #F0F7FF;
            --navy-dark: #042C53;
            --navy-muted: #64748B;
            --navy-subtle: #94A3B8;
            --border-color: #E2E8F0;
            --danger: #DC2626;
            --radius-md: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #FFFFFF;
            color: var(--navy-dark);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        @media (max-width: 600px) {
            .topbar-inner {
                padding: 0 12px;
            }
            .topbar-user-email {
                display: none !important;
            }
            .topbar-right {
                gap: 8px;
            }
        }

        /* Top Bar */
        .submit-topbar {
            background: #FFFFFF;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }

        .topbar-inner {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .topbar-logo {
            height: 24px;
            width: auto;
            display: block;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
            white-space: nowrap;
        }

        .topbar-user-email {
            font-size: 13px;
            color: #64748B;
            font-weight: 500;
        }

        .topbar-link-btn {
            background: transparent;
            color: #378ADD;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .topbar-link-btn:hover {
            text-decoration: underline;
        }

        .btn-signout {
            background: transparent;
            border: none;
            color: #64748B;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 8px;
        }

        .btn-signout:hover {
            color: var(--navy-dark);
        }

        /* Auth Gate State */
        .auth-gate {
            position: fixed;
            inset: 0;
            background: #FFFFFF;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-gate-bar {
            width: 48px;
            height: 3px;
            background: #378ADD;
            border-radius: 2px;
            animation: pulse 1s infinite ease-in-out;
            margin-bottom: 12px;
        }

        .auth-gate-text {
            font-size: 14px;
            color: #64748B;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scaleX(0.7); }
            50% { opacity: 1; transform: scaleX(1); }
        }

        /* Responsive Bottom Sheet for Mobile Preview */
        .preview-bottom-sheet {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 44, 83, 0.4);
            z-index: 200;
            align-items: flex-end;
            justify-content: center;
        }

        .preview-sheet-content {
            background: #FFFFFF;
            width: 100%;
            max-width: 500px;
            border-radius: 16px 16px 0 0;
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }
        /* Room under the form for the floating Preview button */
        @media (max-width: 1023px) {
            #wizardMount { padding-bottom: 72px; }
        }
    </style>

    <script src="../js/plans-config.js?v=3.0.0"></script>
    <script src="../js/visibility.js?v=3.0.1"></script>
    <script src="../js/business-fields.js?v=3.0.1"></script>
    <script src="../js/scope.js?v=2.9.2"></script>
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
</head>

<body>

    <!-- 1. Checking Auth State Gate -->
    <div class="auth-gate" id="loadingOverlay" role="status" aria-live="polite">
        <div class="auth-gate-bar"></div>
        <p class="auth-gate-text">Checking authentication...</p>
    </div>

    <!-- 2. Application Top Bar -->
    <header class="submit-topbar" id="submitTopbar" style="display: none;">
        <div class="topbar-inner">
            <div class="topbar-left">
                <a href="/" class="topbar-brand" title="Calzada Homepage">
                    <img width="500" height="175" src="../assets/logo-header-blue.webp" alt="Calzada Logo" class="topbar-logo">
                </a>
            </div>

            <div class="topbar-right">
                <span class="topbar-user-email" id="topbarUserEmail">--</span>
                <a href="/my-business" class="topbar-link-btn" id="topbarMyBusinessLink">My Business</a>
                <button type="button" class="btn-signout" id="submitSignOutBtn" title="Sign Out" aria-label="Sign out">
                    Sign Out
                </button>
            </div>
        </div>
    </header>

    <!-- 3. 5-Step Registration Wizard Container -->
    <main id="submitContainer" style="display: none;">
        <div id="wizardMount"></div>
    </main>

    <!-- 4. Phone Preview Bottom Sheet Modal -->
    <div id="previewBottomSheet" class="preview-bottom-sheet">
        <div class="preview-sheet-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <span style="font-weight: 700; font-size: 15px; color: #042C53;">Places Live Preview</span>
                <button type="button" id="btnCloseSheet" style="background: transparent; border: none; font-size: 20px; color: #64748B; cursor: pointer; padding: 4px;">&times;</button>
            </div>
            <div id="sheetCardMount"></div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            db, 
            collection, 
            onAuthStateChanged, 
            signOut,
            query,
            where,
            getDocs
        } from "../js/firebase-init.js";
        import { RegisterWizard } from "../js/register-wizard.js?v=3.0.4";

        const loadingOverlay = document.getElementById('loadingOverlay');
        const submitTopbar = document.getElementById('submitTopbar');
        const submitContainer = document.getElementById('submitContainer');
        const topbarUserEmail = document.getElementById('topbarUserEmail');
        const submitSignOutBtn = document.getElementById('submitSignOutBtn');

        let wizardInstance = null;

        if (submitSignOutBtn) {
            submitSignOutBtn.addEventListener('click', async () => {
                await signOut(auth);
                window.location.href = "/login?redirect=/submit";
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/login?redirect=/submit";
                return;
            }

            if (topbarUserEmail) {
                topbarUserEmail.textContent = user.email || user.displayName || 'Authenticated User';
            }

            // Check if user already has an active business ('pending' or 'approved')
            // unless bypass flag is present for testing
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('new')) {
                try {
                    const q = query(collection(db, "businesses"), where("ownerId", "==", user.uid));
                    const snap = await getDocs(q);
                    let hasActive = false;
                    snap.docs.forEach(docSnap => {
                        const data = docSnap.data();
                        // Any application still in progress counts (one business per owner)
                        if (['pending', 'needs_changes', 'awaiting_payment', 'payment_review', 'approved'].includes(data.status)) {
                            hasActive = true;
                        }
                    });

                    if (hasActive) {
                        window.location.href = "/my-business";
                        return;
                    }
                } catch (err) {
                    console.warn('Error checking existing businesses on submit:', err);
                }
            }

            loadingOverlay.style.display = 'none';
            submitTopbar.style.display = 'block';
            submitContainer.style.display = 'block';

            // Initialize 5-step registration wizard
            wizardInstance = new RegisterWizard({
                auth,
                db,
                user,
                containerEl: document.getElementById('wizardMount')
            });
            window.wizardInstance = wizardInstance;
            await wizardInstance.init();

            // Mobile Bottom Sheet Preview Handler
            const phoneBtn = document.getElementById('btnOpenPhonePreview');
            const sheet = document.getElementById('previewBottomSheet');
            const sheetMount = document.getElementById('sheetCardMount');
            const closeBtn = document.getElementById('btnCloseSheet');

            if (phoneBtn && sheet && sheetMount) {
                phoneBtn.addEventListener('click', () => {
                    const liveCard = document.getElementById('placesLiveCard');
                    if (liveCard) {
                        sheetMount.innerHTML = liveCard.outerHTML;
                    }
                    sheet.style.display = 'flex';
                });

                closeBtn.addEventListener('click', () => {
                    sheet.style.display = 'none';
                });

                sheet.addEventListener('click', (e) => {
                    if (e.target === sheet) {
                        sheet.style.display = 'none';
                    }
                });
            }
        });

        // Fallback timeout
        setTimeout(() => {
            if (loadingOverlay && loadingOverlay.style.display !== 'none' && !auth.currentUser) {
                window.location.href = "/login?redirect=/submit";
            }
        }, 8000);
    </script>
</body>

</html>
