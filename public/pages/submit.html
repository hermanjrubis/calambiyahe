<body>

    <!-- 1. Checking Auth State Gate -->
    <div class="auth-gate" id="loadingOverlay" role="status" aria-live="polite">
        <div class="auth-gate-bar"></div>
        <p class="auth-gate-text">Checking authentication...</p>
    </div>

    <!-- 2. Application Top Bar -->
    <header class="submit-topbar" id="submitTopbar" style="display: none;">
        <div class="topbar-inner">
            <div class="topbar-left">
                <a href="/" class="topbar-brand" title="Calzada Homepage">
                    <img width="500" height="175" src="../assets/logo-header-blue.webp" alt="Calzada Logo" class="topbar-logo">
                </a>
            </div>

            <div class="topbar-right">
                <span class="topbar-user-email" id="topbarUserEmail">--</span>
                <a href="/my-business" class="topbar-link-btn" id="topbarMyBusinessLink">My Business</a>
                <button type="button" class="btn-signout" id="submitSignOutBtn" title="Sign Out" aria-label="Sign out">
                    Sign Out
                </button>
            </div>
        </div>
    </header>

    <!-- 3. 5-Step Registration Wizard Container -->
    <main id="submitContainer" style="display: none;">
        <div id="wizardMount"></div>
    </main>

    <!-- 4. Phone Preview Bottom Sheet Modal -->
    <div id="previewBottomSheet" class="preview-bottom-sheet">
        <div class="preview-sheet-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <span style="font-weight: 700; font-size: 15px; color: #042C53;">Places Live Preview</span>
                <button type="button" id="btnCloseSheet" style="background: transparent; border: none; font-size: 20px; color: #64748B; cursor: pointer; padding: 4px;">&times;</button>
            </div>
            <div id="sheetCardMount"></div>
        </div>
    </div>

    <script type="module">
        import { 
            auth, 
            db, 
            collection, 
            onAuthStateChanged, 
            signOut,
            query,
            where,
            getDocs
        } from "../js/firebase-init.js";
        import { RegisterWizard } from "../js/register-wizard.js?v=3.1.1";

        const loadingOverlay = document.getElementById('loadingOverlay');
        const submitTopbar = document.getElementById('submitTopbar');
        const submitContainer = document.getElementById('submitContainer');
        const topbarUserEmail = document.getElementById('topbarUserEmail');
        const submitSignOutBtn = document.getElementById('submitSignOutBtn');

        let wizardInstance = null;

        if (submitSignOutBtn) {
            submitSignOutBtn.addEventListener('click', async () => {
                await signOut(auth);
                window.location.href = "/login?redirect=/submit";
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/login?redirect=/submit";
                return;
            }

            if (topbarUserEmail) {
                topbarUserEmail.textContent = user.email || user.displayName || 'Authenticated User';
            }

            // Check if user already has an active business ('pending' or 'approved')
            // unless bypass flag is present for testing
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('new')) {
                try {
                    const q = query(collection(db, "businesses"), where("ownerId", "==", user.uid));
                    const snap = await getDocs(q);
                    let hasActive = false;
                    snap.docs.forEach(docSnap => {
                        const data = docSnap.data();
                        // Any application still in progress counts (one business per owner)
                        if (['pending', 'needs_changes', 'awaiting_payment', 'payment_review', 'approved'].includes(data.status)) {
                            hasActive = true;
                        }
                    });

                    if (hasActive) {
                        window.location.href = "/my-business";
                        return;
                    }
                } catch (err) {
                    console.warn('Error checking existing businesses on submit:', err);
                }
            }

            loadingOverlay.style.display = 'none';
            submitTopbar.style.display = 'block';
            submitContainer.style.display = 'block';

            // Initialize 5-step registration wizard
            wizardInstance = new RegisterWizard({
                auth,
                db,
                user,
                containerEl: document.getElementById('wizardMount')
            });
            window.wizardInstance = wizardInstance;
            await wizardInstance.init();

            // Mobile Bottom Sheet Preview Handler
            const phoneBtn = document.getElementById('btnOpenPhonePreview');
            const sheet = document.getElementById('previewBottomSheet');
            const sheetMount = document.getElementById('sheetCardMount');
            const closeBtn = document.getElementById('btnCloseSheet');

            if (phoneBtn && sheet && sheetMount) {
                phoneBtn.addEventListener('click', () => {
                    const liveCard = document.getElementById('placesLiveCard');
                    if (liveCard) {
                        sheetMount.innerHTML = liveCard.outerHTML;
                    }
                    sheet.style.display = 'flex';
                });

                closeBtn.addEventListener('click', () => {
                    sheet.style.display = 'none';
                });

                sheet.addEventListener('click', (e) => {
                    if (e.target === sheet) {
                        sheet.style.display = 'none';
                    }
                });
            }
        });

        // Fallback timeout
        setTimeout(() => {
            if (loadingOverlay && loadingOverlay.style.display !== 'none' && !auth.currentUser) {
                window.location.href = "/login?redirect=/submit";
            }
        }, 8000);
    </script>
